<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>尖沙咀 Demo — 香港 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10; color: #e8eef7;
    background: rgba(10, 16, 28, 0.72); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px; padding: 12px 14px; max-width: 340px; backdrop-filter: blur(6px);
  }
  #hud h1 { font-size: 16px; margin: 0 0 4px; font-weight: 700; }
  #hud p { font-size: 12px; line-height: 1.6; margin: 4px 0; color: #b9c6da; white-space: pre-line; }
  #hud .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13px; color: #fff; background: #2563eb; border: 0;
    border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  button.secondary { background: #334155; }
  button:hover { filter: brightness(1.15); }
  #bar-wrap { height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; margin-top: 8px; display: none; }
  #bar { height: 100%; width: 0%; background: #38bdf8; }
  #status { font-size: 12px; color: #7dd3fc; min-height: 16px; }
  #help {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: #dbe4f0; background: rgba(10, 16, 28, 0.72); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px; padding: 8px 16px; font-size: 12px; white-space: nowrap; backdrop-filter: blur(6px);
  }
  #drop-hint {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(37, 99, 235, 0.25); border: 3px dashed #60a5fa; border-radius: 16px;
    color: #fff; font-size: 22px; font-weight: 700; pointer-events: none;
  }
  #toast {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%) translateY(8px); z-index: 11;
    color: #fff; background: rgba(10, 16, 28, 0.85); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px; padding: 10px 20px; font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #sit-prompt {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); z-index: 11;
    color: #fff; background: rgba(10, 16, 28, 0.85); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px; padding: 10px 20px; font-size: 14px; white-space: nowrap;
    display: none; pointer-events: none;
  }
  #car-prompt {
    position: fixed; bottom: 156px; left: 50%; transform: translateX(-50%); z-index: 11;
    color: #fff; background: rgba(10, 16, 28, 0.85); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px; padding: 10px 20px; font-size: 14px; white-space: nowrap;
    display: none; pointer-events: none;
  }
  #nav-hud {
    position: fixed; top: 12px; right: 12px; z-index: 10; text-align: right;
    color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.8); pointer-events: none;
    display: none;
  }
  #nav-speed { font-size: 56px; font-weight: 200; line-height: 1; letter-spacing: -1px; }
  #nav-unit { font-size: 13px; color: #cbd5e1; margin-top: 2px; }
  #nav-nav { font-size: 14px; color: #e2e8f0; margin-top: 8px; }
  .touch-help { display: none; }
  #touch-ui { display: none; position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #joy {
    position: absolute; left: 20px; bottom: 20px; width: 120px; height: 120px;
    border-radius: 50%; background: rgba(10, 16, 28, 0.45);
    border: 1px solid rgba(255,255,255,0.25); pointer-events: auto; touch-action: none;
  }
  #joy-knob {
    position: absolute; left: 50%; top: 50%; width: 48px; height: 48px;
    border-radius: 50%; background: rgba(255,255,255,0.55);
    transform: translate(-50%, -50%);
  }
  #touch-btns {
    position: absolute; right: 20px; bottom: 20px; display: flex; gap: 10px;
    pointer-events: auto;
  }
  .touch-btn {
    width: 64px; height: 64px; border-radius: 50%; padding: 0; font-size: 16px;
    background: rgba(51, 65, 85, 0.8); border: 1px solid rgba(255,255,255,0.25);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .touch-btn.on { background: #2563eb; }
  @media (pointer: coarse) {
    #touch-ui { display: block; }
    .kb-help { display: none; }
    .touch-help { display: inline; }
    #help { bottom: 210px; white-space: normal; max-width: 92vw; text-align: center; }
    #toast { bottom: 160px; }
    #sit-prompt { bottom: 260px; }
    #car-prompt { bottom: 310px; }
  }
  #err { color: #fca5a5; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <h1>尖沙咀 Demo</h1>
  <p id="meta">尖沙咀 3D · 尚未載入模型</p>
  <p id="stats"></p>
  <div id="bar-wrap"><div id="bar"></div></div>
  <p id="status">正在載入模型…</p>
  <div class="row">
    <button id="pick">選擇 .glb 檔案</button>
    <button id="reset" class="secondary">重置視角</button>
    <button id="shadowToggle" class="secondary">陰影：開</button>
    <button id="modeToggle" class="secondary">模式：飛行</button>
    <button id="navToggle" class="secondary">導航模式：開</button>
    <button id="nightToggle" class="secondary">夜間：關</button>
    <button id="punchBtn" class="secondary">拳 (J)</button>

<div id="help"><span class="kb-help">飛行：WASD 飛 · Q / E 上下 · 拖曳轉視角 — 步行：WASD 移動 · Shift 跑 · 空白鍵飛 · Ctrl 降 · E 坐下 · F 上車</span><span class="touch-help">飛行：單指拖曳轉視角 · 雙指縮放 — 步行：左搖桿移動 · 拖曳轉鏡頭 · 按住跑／升／降</span></div>
<div id="toast"></div>
<div id="sit-prompt"></div>
<div id="car-prompt"></div>
<div id="nav-hud">
  <div id="nav-speed">0</div>
  <div id="nav-unit">km/h</div>
  <div id="nav-nav">尖沙咀</div>
</div>
<div id="touch-ui">
  <div id="joy"><div id="joy-knob"></div></div>
  <div id="touch-btns">
    <button id="btn-run" class="touch-btn">跑</button>

    <button id="btn-down" class="touch-btn">降</button>
  </div>
</div>
<div id="drop-hint">放開以載入 .glb</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const app = document.getElementById('app');
const metaEl = document.getElementById('meta');
const statsEl = document.getElementById('stats');
const statusEl = document.getElementById('status');
const barWrap = document.getElementById('bar-wrap');
const barEl = document.getElementById('bar');
const fileInput = document.getElementById('file');
const dropHint = document.getElementById('drop-hint');

// ---------- renderer / scene ----------
// Mobile (touch / narrow screen) gets the lite treatment: no antialias,
// pixel ratio 1, shadows off by default, and the lite map (see entry
// below). The full map's textures need ~1.9GB of GPU memory, which
// kills phone browsers; the lite map (256²) needs ~360MB.
const isMobile = matchMedia('(pointer: coarse)').matches || window.innerWidth < 768;
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
renderer.setPixelRatio(isMobile ? 1 : Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5d6);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 8000);
camera.position.set(400, 260, 400);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 20, 0);

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x8a7a5a, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(sun.target);

// ---------- loader ----------
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

let model = null;
let modelSize = new THREE.Vector3(300, 100, 300);
let modelCenter = new THREE.Vector3();
let recenterDone = false;

// ---------- mode: 'walk' (third-person) or 'fly' (orbit + WASD) ----------
// Default is fly: the page opens on the aerial view; switch to walk
// to drop the character in.
let mode = 'fly';

function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.style.color = isError ? '#fca5a5' : '#7dd3fc';
}

function showProgress(pct) {
  barWrap.style.display = 'block';
  barEl.style.width = Math.round(pct * 100) + '%';
}

function frameModel() {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  modelSize = size;
  // record the raw (pre-recenter) centre once per model: later frameModel
  // calls (fly-mode reset) see the already-recentered model, whose centre
  // is ~0 and must not overwrite this
  if (!recenterDone) { modelCenter = center; recenterDone = true; }

  // recenter: ground at y=0, center at origin (XZ)
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= box.min.y;

  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim * 1.35;
  camera.position.set(dist * 0.75, dist * 0.55, dist * 0.75);
  controls.target.set(0, size.y * 0.3, 0);
  controls.update();

  // sun + shadows: a tight box that follows the character (or the orbit
  // target in fly mode) — covering the whole 1200m map in one shadow map
  // is both blurry and slow. updateShadowFocus() re-aims it every frame.
  const sc = sun.shadow.camera;
  sc.near = 1; sc.far = 1200;
  sc.updateProjectionMatrix();
  updateShadowFocus();

  // fog + water (harbour, west of the model)
  scene.fog = new THREE.Fog(0x87b5d6, maxDim * 1.6, maxDim * 4.5);
  addWater(size);

  metaEl.textContent = '已載入：' + (model.userData.name || '模型');
  setStatus('載入完成，拖曳旋轉、WASD 移動');
  barWrap.style.display = 'none';
}

const SUN_DIR = new THREE.Vector3(0.8, 1.1, 0.5).normalize();
function updateShadowFocus() {
  if (!model) return;
  const focus = mode === 'walk' ? charPos : controls.target;
  const half = mode === 'walk' ? 120 : 400;
  sun.position.copy(focus).addScaledVector(SUN_DIR, 500);
  sun.target.position.copy(focus);
  sun.target.updateMatrixWorld();
  const sc = sun.shadow.camera;
  if (sc.left !== -half) {
    sc.left = -half; sc.right = half;
    sc.top = half; sc.bottom = -half;
    sc.updateProjectionMatrix();
  }
}

let waterMeshes = [];
function addWater(size) {
  for (const w of waterMeshes) scene.remove(w);
  waterMeshes = [];
  const mat = new THREE.MeshStandardMaterial({
    color: 0x1a5f7a, transparent: true, opacity: 0.85,
    roughness: 0.15, metalness: 0.1
  });
  const mkPlane = (w, d, x, z) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 1.5, z);
    m.receiveShadow = true;
    scene.add(m);
    waterMeshes.push(m);
  };
  // harbour west (-X) of the model, clamped to the map's own z range —
  // a deeper version flooded the north band's west end. Wide (6x) so
  // the harbour reads as open sea to the horizon, not a pond.
  const w = size.x * 6, d = size.z;
  mkPlane(w, d, -size.x / 2 - w / 2 + size.x * 0.2, 0);
  // stacked tiles (map taller than one 600m tile): the southern tile
  // is half harbour, so add a south plane too — land pokes through it
  // where the peninsula tip exists, since the ground there sits above y=1.5
  if (size.z > 900) {
    // south harbour: from the 4D south sea strip (z=+300) far past the
    // procedural Hong Kong Island skyline, wide past its ends — open
    // sea to the horizon. Its north edge (z=+300) stays clear of the
    // east band (which ends at z=0), so it cannot flood the city.
    mkPlane(size.x + 4000, 5000, 0, size.z / 2 + 2200);
  }
}

// ---------- procedural outer city ----------
// Outside the real map there is no data, so the surroundings are faked:
// seeded-random box towers with canvas-drawn window textures — north +
// east bands (Kowloon continues there) and a distant skyline across the
// harbour to the south (Hong Kong Island towers). Window size is kept
// ~3m with texture.repeat per height bucket (bands vs towers) — no
// shader hacks: an earlier onBeforeCompile UV-scaling version rendered
// the facades black. One InstancedMesh per facade variant x bucket, so
// a few hundred buildings cost a handful of draw calls. These meshes
// are never added to the raycast targets or the heightfield: pure
// scenery. A giant sea-blue base plane fills the void past the map.
let outerCityGroup = null;
let outerCityWinMats = [];

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeWindowTextures(facade, litRatio, rng, repeatX, repeatY) {
  // one 12x12m tile holding a 4x4 window grid; the same lit windows are
  // drawn into both canvases so the emissive map lines up with the facade.
  // repeatX/repeatY tile it across a face so windows stay ~3m whatever
  // the building size (no shader UV scaling — that rendered black).
  const S = 128, N = 4, cell = S / N;
  const cMap = document.createElement('canvas'); cMap.width = cMap.height = S;
  const cEmi = document.createElement('canvas'); cEmi.width = cEmi.height = S;
  const m = cMap.getContext('2d'), e = cEmi.getContext('2d');
  m.fillStyle = facade; m.fillRect(0, 0, S, S);
  e.fillStyle = '#000'; e.fillRect(0, 0, S, S);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const x = i * cell + cell * 0.22, y = j * cell + cell * 0.22;
    const w = cell * 0.56, h = cell * 0.56;
    const lit = rng() < litRatio;
    m.fillStyle = lit ? '#ffd489' : '#2e3d4d';
    m.fillRect(x, y, w, h);
    if (lit) { e.fillStyle = '#ffc37a'; e.fillRect(x, y, w, h); }
  }
  const map = new THREE.CanvasTexture(cMap);
  const emissiveMap = new THREE.CanvasTexture(cEmi);
  for (const t of [map, emissiveMap]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeatX, repeatY);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  }
  return { map, emissiveMap };
}

function buildOuterCity() {
  if (outerCityGroup) {
    scene.remove(outerCityGroup);
    outerCityGroup.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const mt of mats) {
        if (!mt) continue;
        if (mt.map) mt.map.dispose();
        if (mt.emissiveMap) mt.emissiveMap.dispose();
        mt.dispose();
      }
    });
    outerCityGroup = null;
    outerCityWinMats = [];
  }
  if (!modelSize) return;
  const sx = modelSize.x, sz = modelSize.z;
  const rng = mulberry32(20261122);
  outerCityGroup = new THREE.Group();

  // window materials: 2 facade variants x 2 height buckets (bands /
  // towers), each with its own texture repeat so windows stay ~3m.
  // Facades are light greys — the earlier dark palette read as a black
  // mass next to the sunlit photo-textured real map.
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x5a5e63, roughness: 0.95 });
  const FACADES = [['#8b939e', 0.3], ['#9c948a', 0.22]];
  const winMats = {}; // key: `${variant}_${bucket}`
  for (let v = 0; v < 2; v++) {
    for (const [bucket, rx, ry] of [['band', 3, 5], ['tower', 4, 16]]) {
      const { map, emissiveMap } = makeWindowTextures(FACADES[v][0], FACADES[v][1], rng, rx, ry);
      winMats[v + '_' + bucket] = new THREE.MeshStandardMaterial({
        map, emissiveMap, emissive: 0xffc37a,
        emissiveIntensity: nightMode ? 1.4 : 0.15, roughness: 0.85
      });
    }
  }
  outerCityWinMats = Object.values(winMats);

  // collect placements: [x, z, w, h, d, variant, bucket]
  const spots = [];
  // clamp: 'S' = north band, south faces flush to the map edge (no gap,
  // no overlap into the map); 'W' = east band, west faces flush.
  // The user wants the procedural city tight against the real one.
  const band = (x0, x1, z0, z1, hMin, hMax, clamp) => {
    for (let x = x0; x < x1; x += 70) for (let z = z0; z < z1; z += 70) {
      if (rng() < 0.15) continue; // gap: street / park
      const w = 22 + rng() * 26, d = 22 + rng() * 26;
      let h = hMin + rng() * (hMax - hMin);
      if (rng() < 0.1) h = hMax + rng() * 50; // occasional tower
      let px = x + (rng() - 0.5) * 12, pz = z + (rng() - 0.5) * 12;
      if (clamp === 'S') pz = Math.min(pz, -sz / 2 - d / 2);
      if (clamp === 'W') px = Math.max(px, sx / 2 + w / 2);
      spots.push([px, pz, w, h, d, rng() < 0.5 ? 0 : 1, 'band']);
    }
  };
  // north band (Kowloon, land): starts at the map's west edge — west of
  // that is harbour. Grid phased so the last row lands on the edge.
  // East band (Hung Hom, land): only as far south as the 4B half —
  // east of 4D's south half is open harbour.
  band(-sx / 2, sx / 2 + 150, -sz / 2 - 420, -sz / 2 + 35, 25, 90, 'S');
  band(sx / 2 + 35, sx / 2 + 450, -sz / 2, 0, 25, 90, 'W');
  // Continuous edge rows: the 70m grid leaves 22-48m gaps between
  // buildings, which reads as a strip of empty ground between the
  // procedural city and the real map. These two rows are placed
  // edge-to-edge with no gaps, faces flush to the map edge — like
  // Hong Kong's street walls. (The grid's own edge row stays; it is
  // hidden behind / inside this wall.)
  let cx = -sx / 2;
  while (cx < sx / 2 + 150) {
    const w = 24 + rng() * 20, d = 24 + rng() * 20;
    let h = 25 + rng() * 65;
    if (rng() < 0.1) h = 90 + rng() * 50;
    spots.push([cx + w / 2, -sz / 2 - d / 2, w, h, d, rng() < 0.5 ? 0 : 1, 'band']);
    cx += w;
  }
  let cz = -sz / 2;
  while (cz < 0) {
    const w = 24 + rng() * 20, d = 24 + rng() * 20;
    let h = 25 + rng() * 65;
    if (rng() < 0.1) h = 90 + rng() * 50;
    spots.push([sx / 2 + d / 2, cz + w / 2, d, h, w, rng() < 0.5 ? 0 : 1, 'band']);
    cz += w;
  }
  // south skyline: Hong Kong Island towers across the harbour. Row
  // distances are real: the Star Ferry crossing (TST pier to Central
  // waterfront) is ~1300m, and the inland towers sit ~600m behind it.
  // The pier is 435m north of the map's south edge, so the rows sit
  // 865m / 1465m past the edge (1300m / 1900m from the pier).
  for (let row = 0; row < 2; row++) {
    const zRow = sz / 2 + (row === 0 ? 865 : 1465);
    for (let x = -sx / 2 - 800; x < sx / 2 + 800; x += 90 + rng() * 50) {
      const h = row === 0 ? 100 + rng() * 100 : 180 + rng() * 140;
      const w = 40 + rng() * 30, d = 40 + rng() * 30;
      spots.push([x, zRow + (rng() - 0.5) * 120, w, h, d, rng() < 0.5 ? 0 : 1, 'tower']);
    }
  }

  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  boxGeo.translate(0, 0.5, 0); // instance origin at the base
  const dummy = new THREE.Object3D();
  const tint = new THREE.Color();
  // one InstancedMesh per facade variant x height bucket (4 total)
  for (let v = 0; v < 2; v++) for (const bucket of ['band', 'tower']) {
    const list = spots.filter((s) => s[5] === v && s[6] === bucket);
    if (!list.length) continue;
    const wm = winMats[v + '_' + bucket];
    const mesh = new THREE.InstancedMesh(
      boxGeo, [wm, wm, roofMat, roofMat, wm, wm], list.length);
    list.forEach((s, i) => {
      // band buildings stand on the ground planes (y=0.5); skyline
      // towers stand on the landmass strip (top y=8, bases sunk in)
      dummy.position.set(s[0], bucket === 'band' ? 0.5 : 0, s[1]);
      dummy.scale.set(s[2], s[3], s[4]);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      const t = 0.85 + rng() * 0.3;
      mesh.setColorAt(i, tint.setRGB(t, t, t));
    });
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = false;
    mesh.receiveShadow = false;
    outerCityGroup.add(mesh);
  }

  // world floor: a giant sea-blue plane at y=0 so there is never a
  // sky-coloured void past the map edge. Real terrain and water sit
  // above it; land planes below sit 0.5m above it.
  const base = new THREE.Mesh(
    new THREE.PlaneGeometry(20000, 20000),
    new THREE.MeshStandardMaterial({ color: 0x1a5f7a, roughness: 0.6, metalness: 0.05 }));
  base.rotation.x = -Math.PI / 2;
  base.position.set(0, 0, 0);
  outerCityGroup.add(base);

  // ground under the two bands (mid-grey asphalt; the real terrain ends
  // at the map edge) + a low landmass strip under the south skyline.
  // Ground planes sit at y=0.5, above the base plane, clear of z-fight.
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x6f7276, roughness: 1 });
  const mkGround = (w, d, x, z) => {
    const g = new THREE.Mesh(new THREE.PlaneGeometry(w, d), groundMat);
    g.rotation.x = -Math.PI / 2;
    g.position.set(x, 0.5, z);
    outerCityGroup.add(g);
  };
  // north ground: matches the band (x from map west edge), deep enough
  // to run into the fog; east ground: matches the band (4B half only)
  mkGround(sx + 150, 2000, 75, -sz / 2 - 1000);
  mkGround(2000, sz / 2, sx / 2 + 1000, -sz / 4);
  const strip = new THREE.Mesh(
    new THREE.BoxGeometry(sx + 1600, 8, 900),
    new THREE.MeshStandardMaterial({ color: 0x3a4a3f, roughness: 1 }));
  strip.position.set(0, 4, sz / 2 + 1165);
  outerCityGroup.add(strip);

  scene.add(outerCityGroup);
}

// ---------- ground height ----------
// Terrain heightfield: bin terrain vertices into one grid (order-independent),
// bilinear interpolation for smooth walking. Buildings/roads come from a
// downward raycast (terrain excluded - the heightfield covers it).
// Multi-tile maps have one terrain mesh per tile; all of them feed the
// same heightfield, so the ground works across the whole map.
let heightGrid = null;
let buildingMeshes = [];
const downRay = new THREE.Raycaster();
// Tsim Sha Tsui Ferry Pier plaza, in scene coords BEFORE recentering
// (Blender rebase X 220, northing -465 -> scene Z 465). Checked against
// the 4D tile's building footprints: open ground, 17m+ clear of the
// nearest buildings, ~100m from the shoreline. spawnCharacter converts
// with modelCenter, so the spawn survives the map growing.
const SPAWN_RAW = { x: 220, z: 465 };

function buildGround() {
  model.updateMatrixWorld(true);
  const meshes = [];
  model.traverse((o) => { if (o.isMesh) meshes.push(o); });
  // terrain meshes: children of a node whose name is a terrain model ID
  // (T + digits, e.g. T35250174000106E11) — one per tile. Fallback for
  // models without that naming: the single largest-footprint mesh.
  const isTerrain = (m) => {
    let o = m;
    while (o) {
      if (/^T\d/.test(o.name || '')) return true;
      o = o.parent;
    }
    return false;
  };
  let terrains = meshes.filter(isTerrain);
  if (terrains.length === 0) {
    let best = null, bestArea = 0;
    const tmpBox = new THREE.Box3();
    for (const m of meshes) {
      tmpBox.setFromObject(m);
      const area = (tmpBox.max.x - tmpBox.min.x) * (tmpBox.max.z - tmpBox.min.z);
      if (area > bestArea) { bestArea = area; best = m; }
    }
    terrains = best ? [best] : [];
  }
  const terrainSet = new Set(terrains);
  buildingMeshes = meshes.filter((m) => !terrainSet.has(m));

  // one heightfield over the union of all terrain meshes (~3m cells)
  const box = new THREE.Box3();
  for (const t of terrains) box.expandByObject(t);
  const nx = THREE.MathUtils.clamp(Math.round((box.max.x - box.min.x) / 3), 64, 512);
  const nz = THREE.MathUtils.clamp(Math.round((box.max.z - box.min.z) / 3), 64, 512);
  const data = new Float32Array(nx * nz).fill(-Infinity);
  const v = new THREE.Vector3();
  for (const t of terrains) {
    const pos = t.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(t.matrixWorld);
      const ix = Math.min(nx - 1, Math.max(0, Math.floor((v.x - box.min.x) / (box.max.x - box.min.x) * nx)));
      const iz = Math.min(nz - 1, Math.max(0, Math.floor((v.z - box.min.z) / (box.max.z - box.min.z) * nz)));
      const idx = iz * nx + ix;
      if (v.y > data[idx]) data[idx] = v.y;
    }
  }
  // Fill cells that got no terrain vertex by diffusion from their
  // neighbours. The 4D terrain mesh is coarse (~7m vertex spacing vs
  // 3m cells), so most cells on that tile would otherwise be holes
  // filled with the global minimum — and the character falls through
  // the floor. Diffusion is safe here: the terrain is smooth, so a
  // filled cell is close to the true surface.
  let changed = true;
  while (changed) {
    changed = false;
    for (let iz = 0; iz < nz; iz++) {
      for (let ix = 0; ix < nx; ix++) {
        const idx = iz * nx + ix;
        if (data[idx] !== -Infinity) continue;
        let sum = 0, n = 0;
        if (ix > 0 && data[idx - 1] !== -Infinity) { sum += data[idx - 1]; n++; }
        if (ix < nx - 1 && data[idx + 1] !== -Infinity) { sum += data[idx + 1]; n++; }
        if (iz > 0 && data[idx - nx] !== -Infinity) { sum += data[idx - nx]; n++; }
        if (iz < nz - 1 && data[idx + nx] !== -Infinity) { sum += data[idx + nx]; n++; }
        if (n > 0) { data[idx] = sum / n; changed = true; }
      }
    }
  }
  let gmin = Infinity;
  for (let i = 0; i < data.length; i++) if (data[i] !== -Infinity && data[i] < gmin) gmin = data[i];
  for (let i = 0; i < data.length; i++) if (data[i] === -Infinity) data[i] = gmin;
  heightGrid = { minX: box.min.x, minZ: box.min.z,
    sizeX: box.max.x - box.min.x, sizeZ: box.max.z - box.min.z, nx, nz, data };
}

function terrainHeight(x, z) {
  if (!heightGrid) return 0;
  const g = heightGrid;
  const fx = THREE.MathUtils.clamp((x - g.minX) / g.sizeX * (g.nx - 1), 0, g.nx - 1.001);
  const fz = THREE.MathUtils.clamp((z - g.minZ) / g.sizeZ * (g.nz - 1), 0, g.nz - 1.001);
  const ix = Math.floor(fx), iz = Math.floor(fz);
  const tx = fx - ix, tz = fz - iz;
  const ix1 = Math.min(ix + 1, g.nx - 1), iz1 = Math.min(iz + 1, g.nz - 1);
  const h00 = g.data[iz * g.nx + ix], h10 = g.data[iz * g.nx + ix1];
  const h01 = g.data[iz1 * g.nx + ix], h11 = g.data[iz1 * g.nx + ix1];
  return (h00 * (1 - tx) + h10 * tx) * (1 - tz) + (h01 * (1 - tx) + h11 * tx) * tz;
}

// Raycast targets, prefiltered per query: raycasting ~500 meshes every
// frame used to be what made the demo stutter — the two road-network
// meshes have ~800k triangles between them and their bounding spheres
// cover the whole map, so every ray tested them all. Fix: (1) skip
// monster meshes (>50k tris — ground-level roads, the heightfield
// already covers them), (2) test only meshes whose XZ bounds contain
// the query point.
let raycastTargets = [];
function buildRaycastTargets() {
  raycastTargets = [];
  const box = new THREE.Box3();
  for (const m of buildingMeshes) {
    const geo = m.geometry;
    const tris = (geo.index ? geo.index.count : geo.attributes.position.count) / 3;
    if (tris > 50000) continue;
    box.setFromObject(m);
    raycastTargets.push({ mesh: m,
      minX: box.min.x, maxX: box.max.x, minZ: box.min.z, maxZ: box.max.z });
  }
}

function groundHeight(x, z, refY) {
  let h = terrainHeight(x, z);
  // highest building hit near/below the character: lets the character
  // step onto podiums, but not pop up onto footbridges overhead.
  downRay.set(new THREE.Vector3(x, refY + 50, z), new THREE.Vector3(0, -1, 0));
  downRay.far = refY + 60; // always reach below the ground (was a fixed
  // 60, which at spawn refY=50 stopped 40m above the floor)
  for (const t of raycastTargets) {
    if (x < t.minX || x > t.maxX || z < t.minZ || z > t.maxZ) continue;
    const hits = downRay.intersectObject(t.mesh, false);
    for (const hit of hits) {
      if (hit.point.y <= refY + 2.5) { h = Math.max(h, hit.point.y); break; }
    }
  }
  return h;
}

// ---------- map boundary: fog-of-war walls + playable bounds ----------
let bounds = null; // {minX, maxX, minZ, maxZ}, from the terrain heightfield
let fogWalls = [];
let fogWallMat = null;

function buildFogWalls() {
  for (const w of fogWalls) scene.remove(w);
  fogWalls = [];
  if (!heightGrid) return;
  const g = heightGrid;
  const margin = 15;
  bounds = {
    minX: g.minX + margin, maxX: g.minX + g.sizeX - margin,
    minZ: g.minZ + margin, maxZ: g.minZ + g.sizeZ - margin
  };
  // mist texture: opaque fog at the bottom, fading to clear at the top
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 256, 0, 0);
  grad.addColorStop(0, 'rgba(200, 215, 230, 0.95)');
  grad.addColorStop(0.5, 'rgba(200, 215, 230, 0.55)');
  grad.addColorStop(1, 'rgba(200, 215, 230, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 400; i++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + Math.random() * 0.08) + ')';
    ctx.fillRect(Math.random() * 256, Math.random() * 256,
      20 + Math.random() * 60, 4 + Math.random() * 10);
  }
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, side: THREE.DoubleSide,
    depthWrite: false, fog: false
  });
  fogWallMat = mat;
  const wallH = 160; // taller than the tallest tower (~132m)
  const mkWall = (w, x, z, ry) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, wallH), mat);
    m.position.set(x, wallH / 2, z);
    m.rotation.y = ry;
    m.renderOrder = 10;
    scene.add(m);
    fogWalls.push(m);
  };
  const cx = (bounds.minX + bounds.maxX) / 2, cz = (bounds.minZ + bounds.maxZ) / 2;
  const sx = bounds.maxX - bounds.minX, sz = bounds.maxZ - bounds.minZ;
  mkWall(sx, cx, bounds.minZ, 0);
  // south wall: two segments with a 60m channel for the Star Ferry
  // (it sails out through the gap; the player is still blocked by
  // clampToBounds — the walls are visual only)
  const ferryX = 270, channel = 60;
  const gapL = ferryX - channel / 2, gapR = ferryX + channel / 2;
  mkWall(gapL - bounds.minX, (bounds.minX + gapL) / 2, bounds.maxZ, 0);
  mkWall(bounds.maxX - gapR, (gapR + bounds.maxX) / 2, bounds.maxZ, 0);
  mkWall(sz, bounds.minX, cz, Math.PI / 2);
  mkWall(sz, bounds.maxX, cz, Math.PI / 2);
}

// boundary toast: "the area ahead — explore it later"
const toastEl = document.getElementById('toast');
let toastTimer = null, lastToast = 0;
function showBoundaryToast() {
  const now = performance.now();
  if (now - lastToast < 8000) return; // at most once per 8s
  lastToast = now;
  toastEl.textContent = '前面的區域，以後再來探索吧！';
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3500);
}

function clampToBounds() {
  if (!bounds) return;
  let hit = false;
  if (charPos.x < bounds.minX) { charPos.x = bounds.minX; hit = true; }
  if (charPos.x > bounds.maxX) { charPos.x = bounds.maxX; hit = true; }
  if (charPos.z < bounds.minZ) { charPos.z = bounds.minZ; hit = true; }
  if (charPos.z > bounds.maxZ) { charPos.z = bounds.maxZ; hit = true; }
  if (hit) showBoundaryToast();
}

// ---------- navigation mode: HUD ----------
// A HUD with speed / heading / area. The blue path ribbon used to be
// here too, but it was removed: draping it over the ground needed 21
// raycasts per frame, and even with prefiltered targets the big podium
// meshes (tens of thousands of faces, bounding spheres covering the
// whole street) made it cost too much. Pure overhead, so it's gone.
let navMode = true;
let nightMode = false;

// Nav HUD: speed (from actual movement), compass heading, area name
const navHud = document.getElementById('nav-hud');
const navSpeedEl = document.getElementById('nav-speed');
const navNavEl = document.getElementById('nav-nav');
const _prevPos = new THREE.Vector3();
let smoothKmh = 0;
const COMPASS = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
function updateNavHud(dt) {
  if (!navMode || mode !== 'walk' || !model) { navHud.style.display = 'none'; return; }
  navHud.style.display = 'block';
  // speed: distance moved per second -> km/h, smoothed
  const dist = charPos.distanceTo(_prevPos);
  _prevPos.copy(charPos);
  const kmh = dt > 0 ? (dist / dt) * 3.6 : 0;
  smoothKmh += (kmh - smoothKmh) * Math.min(1, dt * 6);
  navSpeedEl.textContent = Math.round(smoothKmh);
  // heading: north is -Z in this scene (Blender northing -> glTF -Z)
  const headingDeg = (THREE.MathUtils.radToDeg(Math.atan2(Math.sin(charYaw), -Math.cos(charYaw))) + 360) % 360;
  const compass = COMPASS[Math.round(headingDeg / 45) % 8];
  // area: convert back to pre-recenter scene coords (Canton Road is at
  // raw x -266; the south tile / harbourfront is raw z > 300)
  const rawX = charPos.x + modelCenter.x;
  const rawZ = charPos.z + modelCenter.z;
  let area = '尖沙咀';
  if (Math.abs(rawX - (-266)) < 40 && Math.abs(rawZ) < 200) area = '廣東道';
  else if (rawZ > 300) area = '尖沙咀海濱';
  navNavEl.textContent = area + ' · ' + compass;
}

function setNavMode(on) {

function spawnCharacter() {
  // teleporting while seated would leave the character sitting in mid-air
  if (sitState !== 'stand') cancelSit();
  // same while driving: drop out of the car first
  if (carState !== 'none') cancelCar();
  const sx = SPAWN_RAW.x - modelCenter.x;
  const sz = SPAWN_RAW.z - modelCenter.z;
  charPos.set(sx, 0, sz);
  charPos.y = groundHeight(sx, sz, 50);
  charYaw = 0; // face the harbour (south, +Z)
  charGroup.position.copy(charPos);
  charGroup.rotation.y = charYaw;
  _prevPos.copy(charPos); // so the speedometer doesn't spike on spawn
  // camera north of the character, looking south at the pier + harbour
  camYaw = Math.PI;
  camPitch = 0.35;
  camDist = 14;
}

// ---------- walk-mode camera ----------
let camYaw = Math.PI, camPitch = 0.35, camDist = 14;
let dragging = false, lastX = 0, lastY = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (mode !== 'walk') return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointermove', (e) => {
  if (!dragging || mode !== 'walk') return;
  camYaw -= (e.clientX - lastX) * 0.005;
  camPitch = THREE.MathUtils.clamp(camPitch + (e.clientY - lastY) * 0.004, 0.08, 1.2);
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointerup', () => { dragging = false; });
renderer.domElement.addEventListener('wheel', (e) => {
  if (mode !== 'walk') return;
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.01, 2, 40);
}, { passive: true });

function updateWalkCamera() {
  const target = new THREE.Vector3(charPos.x, charPos.y + 2.2, charPos.z);
  const off = new THREE.Vector3(
    Math.sin(camYaw) * Math.cos(camPitch),
    Math.sin(camPitch),
    Math.cos(camYaw) * Math.cos(camPitch)
  ).multiplyScalar(camDist);
  camera.position.copy(target).add(off);
  camera.lookAt(target);
}

// ---------- mode switching ----------
function setMode(m) {
  // switching modes while seated: stand back up first (the bench is a
  // walk-mode thing; flying off while seated would freeze the pose)
  if (sitState !== 'stand') cancelSit();
  // same while driving: get out of the car first (no exit animation —
  // just snap back to the ground so the mode switch can't get stuck)
  if (carState !== 'none') cancelCar();
  mode = m;
  document.getElementById('modeToggle').textContent = '模式：' + (mode === 'walk' ? '步行' : '飛行');
  controls.enabled = (mode === 'fly');
  if (mode === 'walk' && model) updateWalkCamera();
  if (mode === 'fly' && model) {
    // put the orbit target on the character so fly starts from where you are
    controls.target.set(charPos.x, charPos.y + 2, charPos.z);
    controls.update();
  }
}
document.getElementById('modeToggle').addEventListener('click', () => {
  setMode(mode === 'walk' ? 'fly' : 'walk');
});

function onLoaded(gltf, name) {
  if (model) scene.remove(model);
  model = gltf.scene;
  model.userData.name = name;
  model.traverse((o) => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });
  // Mobile: no mipmaps. Mipmaps cost +33% GPU texture memory and iOS
  // kills the tab; on a phone screen the shimmer is barely visible.
  if (isMobile) {
    const seen = new Set();
    model.traverse((o) => {
      if (!o.isMesh) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        if (!m) continue;
        for (const key of Object.keys(m)) {
          const v = m[key];
          if (v && v.isTexture && !seen.has(v)) {
            seen.add(v);
            v.minFilter = THREE.LinearFilter;
            v.generateMipmaps = false;
            v.needsUpdate = true;
          }
        }
      }
    });
  }
  scene.add(model);
  recenterDone = false;
  frameModel();
  buildGround();
  buildRaycastTargets();
  buildFogWalls();
  buildOuterCity();
  createFerry();
  spawnCharacter();
  createBench();
  createCar();
  createPierDeck();
  setMode(mode); // apply the current mode to the fresh model
  // Mobile: Bryce loads only after the map is done, so the two big
  // .glb parses don't spike memory at the same time (iOS kills the tab).
  if (isMobile && !bryce.group) loadBryce();
}

function onError(err) {
  console.error(err);
  setStatus('載入失敗：' + (err && err.message ? err.message : err), true);
  barWrap.style.display = 'none';
}

function loadFromUrl(url, name) {
  setStatus('載入中：' + name);
  showProgress(0);
  loader.load(url, (g) => onLoaded(g, name), (e) => {
    if (e.total > 0) showProgress(e.loaded / e.total);
  }, onError);
}

function loadFromFile(file) {
  setStatus('讀取檔案：' + file.name);
  showProgress(0.5);
  const reader = new FileReader();
  reader.onload = () => {
    try {
      loader.parse(reader.result, '', (g) => onLoaded(g, file.name), onError);
    } catch (err) { onError(err); }
  };
  reader.onerror = () => onError(new Error('無法讀取檔案'));
  reader.readAsArrayBuffer(file);
}

// ---------- entry: ?model= URL, else default .glb, else picker ----------
// Mobile loads the ultra-lite map (128² textures) when it exists in the
// repo, then lite (256²), then full. The 256² lite map alone still
// exceeds the iOS tab memory limit (textures ~490MB + geometry ~150MB
// + Bryce + decode peaks), so the phone needs the 128² version.
const params = new URLSearchParams(location.search);
const modelParam = params.get('model');
if (modelParam) {
  loadFromUrl(modelParam, modelParam.split('/').pop());
} else {
  const candidates = isMobile
    ? ['./full_tst_tile_ulite.glb', './full_tst_tile_lite.glb', './full_tst_tile.glb']
    : ['./full_tst_tile.glb'];
  (function tryNext(i) {
    if (i >= candidates.length) { setStatus('尚未載入模型，請選擇 full_tst_tile.glb'); return; }
    fetch(candidates[i], { method: 'HEAD' }).then((r) => {
      if (r.ok) loadFromUrl(candidates[i], candidates[i].slice(2));
      else tryNext(i + 1);
    }).catch(() => tryNext(i + 1));
  })(0);
}

// ---------- Star Ferry (procedural, sails TST <-> Central) ----------
// The classic green-hulled double-decker, built from primitives. It
// runs the real Star Ferry route: TST pier (by the spawn) straight
// south across the harbour to the Central waterfront (just north of
// the procedural skyline strip), dwells 5s, turns, and comes back.
// Speed is ~15 m/s — a real crossing takes ~8 min, too slow to watch.
// Berth offsets are tuned for the 2-tile TST map (sz = 1200).
let ferry = null;

function createFerry() {
  if (ferry) scene.remove(ferry.group);
  const g = new THREE.Group();
  const mat = (c, r = 0.6) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
  const green = mat(0x1f6b3a), white = mat(0xe8e8e8), dark = mat(0x1c2733, 0.3), black = mat(0x1a1a1a);
  // hull: extruded plan (rectangle + pointed bow), 32m long, 8m wide.
  // The shape's -y is the bow so that after the -90° X rotation the
  // bow points +z (forward) and the extrusion becomes the height.
  const s = new THREE.Shape();
  s.moveTo(-4, 15); s.lineTo(4, 15); s.lineTo(4, -10); s.lineTo(0, -17); s.lineTo(-4, -10);
  s.closePath();
  const hull = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 3, bevelEnabled: false }), green);
  hull.rotation.x = -Math.PI / 2;
  g.add(hull);
  const box = (w, h, d, m, x, y, z) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    b.position.set(x, y, z); g.add(b); return b;
  };
  box(7.4, 2.2, 26, white, 0, 4.1, -1);      // main deck
  box(7, 2, 20, white, 0, 6.2, -2);          // upper deck
  box(4, 1.8, 3.5, white, 0, 8.1, 6);        // wheelhouse
  box(0.1, 0.9, 24, dark, -3.75, 4.1, -1);   // main-deck windows, port
  box(0.1, 0.9, 24, dark, 3.75, 4.1, -1);    // main-deck windows, starboard
  box(0.1, 0.9, 18, dark, -3.55, 6.2, -2);   // upper-deck windows, port
  box(0.1, 0.9, 18, dark, 3.55, 6.2, -2);    // upper-deck windows, starboard
  box(3.6, 0.9, 0.1, dark, 0, 8.3, 7.8);     // wheelhouse front windows
  const funnel = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 3, 12), black);
  funnel.position.set(0, 8.7, -6); g.add(funnel);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 3, 6), black);
  mast.position.set(0, 10.5, 6); g.add(mast);
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  const sz = modelSize.z;
  ferry = {
    group: g, x: 270, zTST: sz / 2 - 280, zCEN: sz / 2 + 660,
    s: 0, dir: 1, dwell: 3, yaw: 0
  };
  g.position.set(270, 1.35, ferry.zTST);
  scene.add(g);
}

function updateFerry(dt, t) {
  if (!ferry) return;
  const f = ferry;
  const routeLen = f.zCEN - f.zTST;
  if (f.dwell > 0) {
    f.dwell -= dt;
    // turn around smoothly during the dwell
    const targetYaw = f.dir > 0 ? 0 : Math.PI;
    let d = targetYaw - f.yaw;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    f.yaw += d * Math.min(1, dt * 2);
    if (f.dwell <= 0) f.yaw = targetYaw;
  } else {
    // ease speed near the piers (slow within 150m of either end)
    const z = f.zTST + f.s * routeLen;
    const distEnd = f.dir > 0 ? f.zCEN - z : z - f.zTST;
    const speed = 15 * Math.min(1, Math.max(0.15, distEnd / 150));
    f.s += f.dir * speed * dt / routeLen;
    if (f.s >= 1) { f.s = 1; f.dir = -1; f.dwell = 5; }
    if (f.s <= 0) { f.s = 0; f.dir = 1; f.dwell = 5; }
  }
  const z = f.zTST + f.s * routeLen;
  f.group.position.set(f.x, 1.35 + Math.sin(t * 0.7) * 0.1, z);
  f.group.rotation.y = f.yaw;
  f.group.rotation.z = Math.sin(t * 0.5) * 0.01;
  f.group.rotation.x = Math.sin(t * 0.6 + 1) * 0.008;
}

// ---------- touch controls (mobile) ----------
// Virtual joystick (bottom-left) moves the character; drag anywhere else
// on the screen rotates the camera (the pointer handlers above already
// cover touch). Buttons: hold 跑 to run, 升 to fly up, 降 to descend.
const joy = { x: 0, y: 0, active: false, id: null };
let touchRun = false, touchFlyUp = false, touchFlyDown = false;
const joyEl = document.getElementById('joy');
const joyKnob = document.getElementById('joy-knob');
const JOY_RADIUS = 44; // px the knob can travel from centre
function joyMove(e) {
  const r = joyEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const len = Math.hypot(dx, dy);
  if (len > JOY_RADIUS) { dx *= JOY_RADIUS / len; dy *= JOY_RADIUS / len; }
  joyKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
  // dead zone ~15% so a resting thumb doesn't drift the character
  const nx = dx / JOY_RADIUS, ny = dy / JOY_RADIUS;
  if (Math.hypot(nx, ny) < 0.15) { joy.x = 0; joy.y = 0; }
  else { joy.x = nx; joy.y = ny; }
}
function joyEnd(e) {
  if (e.pointerId !== joy.id) return;
  joy.active = false; joy.id = null; joy.x = 0; joy.y = 0;
  joyKnob.style.transform = 'translate(-50%, -50%)';
}
joyEl.addEventListener('pointerdown', (e) => {
  if (joy.active) return;
  joy.active = true; joy.id = e.pointerId;
  joyEl.setPointerCapture(e.pointerId);
  joyMove(e);
});
joyEl.addEventListener('pointermove', (e) => { if (joy.active && e.pointerId === joy.id) joyMove(e); });
joyEl.addEventListener('pointerup', joyEnd);
joyEl.addEventListener('pointercancel', joyEnd);

function holdButton(id, set) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); set(true); el.classList.add('on'); });
  const off = () => { set(false); el.classList.remove('on'); };
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
holdButton('btn-run', (v) => { touchRun = v; });
holdButton('btn-up', (v) => { touchFlyUp = v; });
holdButton('btn-down', (v) => { touchFlyDown = v; });

const clock = new THREE.Clock();
let frames = 0, fpsTime = 0;
const UP = new THREE.Vector3(0, 1, 0);

let flying = false;

// ---------- martial arts (procedural moves on the character) ----------
// The boss wants martial-arts moves as animated models — first try on
// the little character, driven by code (no animation files). Each move
// is a timeline of limb poses; the body plants its feet while striking.
const MOVES = {
  punch: { dur: 0.5 }, // right straight punch
  kick: { dur: 0.7 },  // right front kick
  combo: { dur: 1.8 }  // left punch, right punch, right kick
};
let action = null; // { name, t0 }
function startAction(name) {
  if (mode !== 'walk' || flying) return;
  if (sitState !== 'stand') return; // no martial arts while sitting down
  if (carState !== 'none') return; // no martial arts while in the car
  // rigged character: play the Mixamo clip instead of the procedural pose
  if (bryce) {
    if (name === 'punch') playOneShot('Punching');
    else if (name === 'kick') playOneShot('Kicking');
    else if (name === 'combo') playOneShot('Punching', () => playOneShot('Punching', () => playOneShot('Kicking')));
    return;
  }
  if (action) return;
  action = { name, t0: clock.elapsedTime };
}
function actionPose(now) {
  // returns limb/body overrides for the active move, or null
  if (!action) return null;
  const p = (now - action.t0) / MOVES[action.name].dur;
  if (p >= 1) { action = null; return null; }
  const bump = (a, b) => { // smooth 0→1→0 over the phase [a, b]
    if (p < a || p > b) return 0;
    return Math.sin((p - a) / (b - a) * Math.PI);
  };
  const pose = { armL: 0, armR: 0, legL: 0, legR: 0, bodyX: 0, bodyY: 0 };
  if (action.name === 'punch') {
    const b = bump(0, 1);
    pose.armR = -1.4 * b; pose.bodyY = 0.35 * b; pose.bodyX = 0.08 * b;
  } else if (action.name === 'kick') {
    const b = bump(0, 1);
    pose.legR = -1.2 * b; pose.bodyX = -0.18 * b;
    pose.armL = -0.9 * b; pose.armR = -0.9 * b; // guard up for balance
  } else { // combo: left punch, right punch, right kick
    pose.armL = -1.4 * bump(0, 0.3); pose.bodyY = 0.35 * bump(0, 0.3);
    pose.armR = -1.4 * bump(0.3, 0.6); pose.bodyY += -0.35 * bump(0.3, 0.6);
    const kb = bump(0.62, 0.95);
    pose.legR = -1.2 * kb; pose.bodyX = -0.18 * kb;
    pose.armL = pose.armL || -0.9 * kb; pose.armR = pose.armR || -0.9 * kb;
  }
  return pose;
}

// ---------- Mixamo character (Bryce, rigged + mocap clips) ----------
// Replaces the procedural character once loaded; the procedural one
// stays as a fallback if the file is missing (e.g. before it is pushed
// to the repo). Clips: Idle/Walking/Running (locomotion), Punching/
// Kicking (martial arts). Entering Car/Exiting Car/Driving/Sitting/
// Sitting Idle/Stand Up/Drinking are loaded too, wired in later phases
// (no car or chairs exist yet).
let bryce = null; // { group, mixer, clips, loco, oneShot, current }
function loadBryce() {
  loader.load('./bryce_animated.glb', (g) => {
    const group = g.scene;
    group.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    const mixer = new THREE.AnimationMixer(group);
    const clips = {};
    for (const c of g.animations) clips[c.name] = c;
    bryce = { group, mixer, clips, loco: null, oneShot: null, current: null };
    scene.add(group);
    charGroup.visible = false; // procedural character stands down
    playLoco('Idle');
    console.log('Bryce loaded, clips:', Object.keys(clips).join(', '));
  }, undefined, () => {
    console.warn('bryce_animated.glb not found, using procedural character');
  });
}
function bryceFadeTo(action, dur) {
  if (bryce.current === action) return;
  // Three.js deactivates an action once its weight fades to 0; a plain
  // play() cannot revive it (Idle stayed frozen at weight 0 = T-pose
  // after any one-shot). reset() clears the stale faded-out state first.
  if (!action.isRunning()) action.reset();
  if (bryce.current) bryce.current.crossFadeTo(action, dur, false);
  action.play();
  bryce.current = action;
}
function playLoco(name) {
  if (!bryce || !bryce.clips[name] || bryce.oneShot) return;
  const next = bryce.mixer.clipAction(bryce.clips[name]);
  next.setLoop(THREE.LoopRepeat);
  bryceFadeTo(next, 0.25);
  bryce.loco = next;
}
function playOneShot(name, onDone) {
  if (!bryce || !bryce.clips[name] || bryce.oneShot) return false;
  const a = bryce.mixer.clipAction(bryce.clips[name]);
  a.reset();
  a.setLoop(THREE.LoopOnce);
  a.clampWhenFinished = true;
  bryceFadeTo(a, 0.15);
  bryce.oneShot = a;
  const done = (e) => {
    if (e.action !== a) return;
    bryce.mixer.removeEventListener('finished', done);
    bryce.oneShot = null;
    if (onDone) onDone();
    else if (bryce.loco) bryceFadeTo(bryce.loco, 0.2);
  };
  bryce.mixer.addEventListener('finished', done);
  return true;
}

// ---------- bench + sitting (Mixamo Sitting / Sitting Idle / Stand Up) ----------
// One procedural bench on the pier plaza, 6m south of the spawn, facing
// the harbour. Sitting is Bryce-only (the procedural fallback has no
// skeleton, so its Sitting clips don't exist). State machine:
// 'stand' -> E near bench -> 'sitting' (Sitting one-shot) -> 'seated'
// (Sitting Idle loop) -> E -> 'standing' (Stand Up one-shot) -> 'stand'.
// Movement is locked in every state except 'stand'; the transitions
// ignore E so a double-tap can't desync the state.
let bench = null; // { group, pos, sitPos, yaw }
let sitState = 'stand';
const SIT_RANGE = 2.5;

function createBench() {
  if (bench) { scene.remove(bench.group); bench = null; }
  if (!model) return;
  // bench 6m south of the spawn, on the open plaza (17m+ clear of
  // buildings), seat facing the harbour (+Z) — same view as the spawn.
  const sx = SPAWN_RAW.x - modelCenter.x;
  const sz = SPAWN_RAW.z - modelCenter.z;
  const bx = sx, bz = sz + 6;
  const by = groundHeight(bx, bz, 50);
  const g = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
  const metal = new THREE.MeshStandardMaterial({ color: 0x2f3336, roughness: 0.5, metalness: 0.6 });
  const box = (w, h, d, m, x, y, z, rx = 0) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    b.position.set(x, y, z);
    b.rotation.x = rx;
    g.add(b);
    return b;
  };
  // seat: three wood slats, top at 0.45m (Mixamo sitting hip height)
  for (const dz of [-0.18, 0, 0.18]) box(1.8, 0.06, 0.16, wood, 0, 0.42, dz);
  // backrest: two wood slats on the north side, tilted back slightly
  box(1.8, 0.14, 0.05, wood, 0, 0.7, -0.28, -0.15);
  box(1.8, 0.14, 0.05, wood, 0, 0.92, -0.31, -0.15);
  // dark metal frame: side legs + back posts + stretcher
  for (const dx of [-0.8, 0.8]) {
    box(0.06, 0.45, 0.5, metal, dx, 0.225, 0);
    box(0.06, 0.95, 0.06, metal, dx, 0.475, -0.27, -0.15);
  }
  box(1.6, 0.05, 0.05, metal, 0, 0.15, 0);
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  g.position.set(bx, by, bz);
  scene.add(g);
  // sit spot: in front of the seat's front edge, facing the harbour.
  // The hips land ~0.3m behind the feet in the Mixamo sitting pose,
  // which puts them on the seat (seat spans z -0.275..+0.275).
  bench = {
    group: g,
    pos: new THREE.Vector3(bx, by, bz),
    sitPos: new THREE.Vector3(bx, by, bz + 0.35),
    yaw: 0
  };
}

function toggleSit() {
  if (!bryce || !bench) return; // Bryce only
  if (mode !== 'walk' || flying) return;
  if (carState !== 'none') return; // can't sit down while in the car
  if (sitState === 'stand') {
    const d = Math.hypot(charPos.x - bench.pos.x, charPos.z - bench.pos.z);
    if (d > SIT_RANGE) return;
    if (bryce.oneShot) return; // wait for a move (e.g. punch) to finish
    if (!bryce.clips['Sitting'] || !bryce.clips['Sitting Idle']) return;
    // snap to the sit spot (v1: no walk-up animation)
    sitState = 'sitting';
    charPos.copy(bench.sitPos);
    charYaw = bench.yaw;
    charGroup.position.copy(charPos);
    charGroup.rotation.y = charYaw;
    bryce.group.position.copy(charPos);
    bryce.group.rotation.y = charYaw;
    if (!playOneShot('Sitting', () => {
      if (sitState !== 'sitting') return; // cancelled (mode switch / reset)
      sitState = 'seated';
      playLoco('Sitting Idle');
    })) sitState = 'stand';
  } else if (sitState === 'seated') {
    if (bryce.oneShot) return;
    if (!bryce.clips['Stand Up']) return;
    sitState = 'standing';
    if (!playOneShot('Stand Up', () => {
      if (sitState !== 'standing') return; // cancelled
      sitState = 'stand';
      playLoco('Idle');
    })) sitState = 'seated';
  }
  // 'sitting' / 'standing' transitions ignore E
}

function cancelSit() {
  // force back to standing (mode switch / respawn). The in-flight
  // one-shot (if any) still finishes on its own, but its onDone is
  // guarded by sitState and returns early; updateWalk's playLoco('Idle')
  // then takes over on the next frame.
  if (sitState === 'stand') return;
  sitState = 'stand';
}

const sitPromptEl = document.getElementById('sit-prompt');
const sitBtnEl = document.getElementById('sitBtn');
let lastSitPrompt = null;
function updateSitPrompt() {
  let text = '';
  if (bench && bryce && mode === 'walk') {
    if (sitState === 'seated' || sitState === 'sitting') text = '按 E 站起來';
    else if (sitState === 'stand' && !flying) {
      const d = Math.hypot(charPos.x - bench.pos.x, charPos.z - bench.pos.z);
      if (d <= SIT_RANGE) text = '按 E 坐下';
    }
  }
  if (text !== lastSitPrompt) {
    lastSitPrompt = text;
    sitPromptEl.textContent = text;
    sitPromptEl.style.display = text ? 'block' : 'none';
    sitBtnEl.textContent = (sitState === 'seated' || sitState === 'sitting') ? '站起來 (E)' : '坐下 (E)';
  }
}

// ---------- car + driving (Mixamo Entering Car / Driving / Exiting Car) ----------
// One procedural car on the pier plaza, 9m north of the spawn, facing the
// harbour (+Z, same as the spawn). Driving is Bryce-only. State machine:
// 'none' -> F near the driver door -> 'entering' (Entering Car one-shot)
// -> 'driving' (Driving loop, W/S throttle, A/D steering) -> F ->
// 'exiting' (Exiting Car one-shot) -> 'none'. No collision in v1: the
// car drives through buildings. The driver door is on the right side
// (Hong Kong right-hand drive; facing +Z, right is -X).
let car = null; // { group, pos, yaw, speed }
let carState = 'none';
const CAR_RANGE = 3;
const CAR_ACCEL = 8, CAR_BRAKE = 20, CAR_DRAG = 1.2;
const CAR_MAX_SPEED = 15, CAR_MAX_FAST = 25, CAR_MAX_REVERSE = 5;
const CAR_DOOR_LOCAL = new THREE.Vector3(-1.15, 0, 0.4);
const CAR_SEAT_LOCAL = new THREE.Vector3(-0.45, 0.35, 0.3);

function carLocalToWorld(local) {
  // rotate a car-local offset by the car's yaw, add the car position
  const c = Math.cos(car.yaw), s = Math.sin(car.yaw);
  return new THREE.Vector3(
    car.pos.x + local.x * c + local.z * s,
    car.pos.y + local.y,
    car.pos.z - local.x * s + local.z * c
  );
}

function createCar() {
  if (car) { scene.remove(car.group); car = null; }
  if (!model) return;
  // 9m north of the spawn on the open plaza (17m+ clear of buildings)
  const sx = SPAWN_RAW.x - modelCenter.x;
  const sz = SPAWN_RAW.z - modelCenter.z - 9;
  const cy = groundHeight(sx, sz, 50);
  const g = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: 0x2a3542, roughness: 0.35, metalness: 0.6 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x0e151c, roughness: 0.1, metalness: 0.8 });
  const tyre = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
  const light = new THREE.MeshStandardMaterial({ color: 0xfff6c9, roughness: 0.3, emissive: 0x555533 });
  const box = (w, h, d, m, x, y, z) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    b.position.set(x, y, z);
    g.add(b);
    return b;
  };
  box(1.9, 0.7, 4.5, paint, 0, 0.65, 0);        // body
  box(1.7, 0.6, 2.2, paint, 0, 1.25, -0.2);     // cabin
  box(1.74, 0.45, 2.0, glass, 0, 1.25, -0.2);   // window band
  box(0.35, 0.18, 0.06, light, -0.6, 0.7, 2.26); // headlights
  box(0.35, 0.18, 0.06, light, 0.6, 0.7, 2.26);
  const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 16);
  for (const [wx, wz] of [[-0.85, 1.45], [0.85, 1.45], [-0.85, -1.45], [0.85, -1.45]]) {
    const w = new THREE.Mesh(wheelGeo, tyre);
    w.rotation.z = Math.PI / 2;
    w.position.set(wx, 0.35, wz);
    g.add(w);
  }
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  g.position.set(sx, cy, sz);
  g.rotation.y = 0; // facing south (+Z), same as the spawn
  scene.add(g);
  car = { group: g, pos: new THREE.Vector3(sx, cy, sz), yaw: 0, speed: 0 };
}

function toggleCar() {
  if (!bryce || !car) return; // Bryce only
  if (mode !== 'walk' || flying) return;
  if (sitState !== 'stand') return; // can't get in while sitting down
  if (carState === 'none') {
    const door = carLocalToWorld(CAR_DOOR_LOCAL);
    const d = Math.hypot(charPos.x - door.x, charPos.z - door.z);
    if (d > CAR_RANGE) return;
    if (bryce.oneShot) return; // wait for a move (e.g. punch) to finish
    if (!bryce.clips['Entering Car'] || !bryce.clips['Driving']) return;
    // snap to the door (v1: no walk-up animation)
    carState = 'entering';
    charPos.set(door.x, groundHeight(door.x, door.z, car.pos.y), door.z);
    charYaw = car.yaw;
    charGroup.position.copy(charPos);
    charGroup.rotation.y = charYaw;
    bryce.group.position.copy(charPos);
    bryce.group.rotation.y = charYaw;
    if (!playOneShot('Entering Car', () => {
      if (carState !== 'entering') return; // cancelled (mode switch / reset)
      carState = 'driving';
      playLoco('Driving');
    })) carState = 'none';
  } else if (carState === 'driving') {
    if (bryce.oneShot) return;
    if (!bryce.clips['Exiting Car']) return;
    carState = 'exiting';
    car.speed = 0;
    if (!playOneShot('Exiting Car', () => {
      if (carState !== 'exiting') return; // cancelled
      exitCarToGround();
    })) carState = 'driving';
  }
  // 'entering' / 'exiting' transitions ignore F
}

function exitCarToGround() {
  // Bryce back on the ground by the driver door, walk mode resumes
  const door = carLocalToWorld(CAR_DOOR_LOCAL);
  charPos.set(door.x, groundHeight(door.x, door.z, car.pos.y), door.z);
  charYaw = car.yaw;
  charGroup.position.copy(charPos);
  charGroup.rotation.y = charYaw;
  bryce.group.position.copy(charPos);
  bryce.group.rotation.y = charYaw;
  carState = 'none';
  playLoco('Idle');
}

function cancelCar() {
  // force out of the car without the animation (mode switch / respawn).
  // The in-flight one-shot (if any) still finishes on its own, but its
  // onDone is guarded by carState and returns early; updateWalk's
  // playLoco('Idle') then takes over on the next frame.
  if (carState === 'none') return;
  if (car) exitCarToGround(); // also resets carState + plays Idle
  else carState = 'none';
}

const carPromptEl = document.getElementById('car-prompt');
const carBtnEl = document.getElementById('carBtn');
let lastCarPrompt = null;
function updateCarPrompt() {
  let text = '';
  if (car && bryce && mode === 'walk') {
    if (carState === 'driving' || carState === 'entering') text = '按 F 下車';
    else if (carState === 'none' && !flying) {
      const door = carLocalToWorld(CAR_DOOR_LOCAL);
      const d = Math.hypot(charPos.x - door.x, charPos.z - door.z);
      if (d <= CAR_RANGE) text = '按 F 上車';
    }
  }
  if (text !== lastCarPrompt) {
    lastCarPrompt = text;
    carPromptEl.textContent = text;
    carPromptEl.style.display = text ? 'block' : 'none';
    carBtnEl.textContent = (carState === 'driving' || carState === 'entering') ? '下車 (F)' : '上車 (F)';
  }
}

function updateDrive(dt) {
  // arcade driving: W/S throttle + brake/reverse, A/D steering,
  // Shift for the faster top speed. No collision in v1.
  const running = keys['ShiftLeft'] || keys['ShiftRight'] || touchRun;
  const maxSpeed = running ? CAR_MAX_FAST : CAR_MAX_SPEED;
  if (keys['KeyW']) car.speed += CAR_ACCEL * dt;
  else if (keys['KeyS']) {
    // brake hard while moving forward, reverse once stopped
    car.speed -= (car.speed > 0.5 ? CAR_BRAKE : CAR_ACCEL * 0.6) * dt;
  } else {
    // coast down: rolling drag + air drag (never overshoots past 0)
    car.speed -= Math.sign(car.speed) * Math.min(Math.abs(car.speed), (0.5 + Math.abs(car.speed) * CAR_DRAG) * dt);
  }
  car.speed = THREE.MathUtils.clamp(car.speed, -CAR_MAX_REVERSE, maxSpeed);
  // steering: needs motion (no turning at a standstill), reversed in reverse
  const steer = (keys['KeyA'] ? 1 : 0) - (keys['KeyD'] ? 1 : 0);
  const grip = Math.min(1, Math.abs(car.speed) / 4);
  car.yaw += steer * 1.1 * grip * Math.sign(car.speed) * dt;
  const fwd = new THREE.Vector3(Math.sin(car.yaw), 0, Math.cos(car.yaw));
  car.pos.addScaledVector(fwd, car.speed * dt);
  // stay inside the map (same bounds as the walker)
  if (bounds) {
    let hit = false;
    if (car.pos.x < bounds.minX) { car.pos.x = bounds.minX; hit = true; }
    if (car.pos.x > bounds.maxX) { car.pos.x = bounds.maxX; hit = true; }
    if (car.pos.z < bounds.minZ) { car.pos.z = bounds.minZ; hit = true; }
    if (car.pos.z > bounds.maxZ) { car.pos.z = bounds.maxZ; hit = true; }
    if (hit) { car.speed = 0; showBoundaryToast(); }
  }
  // follow the ground (smoothly, like the walker)
  const gy = groundHeight(car.pos.x, car.pos.z, car.pos.y);
  car.pos.y += (gy - car.pos.y) * Math.min(1, dt * 6);
  car.group.position.copy(car.pos);
  car.group.rotation.y = car.yaw;
  // the character rides along: nav HUD + shadow focus track charPos
  charPos.copy(car.pos);
  charYaw = car.yaw;
  charGroup.position.copy(charPos);
  charGroup.rotation.y = charYaw;
  if (bryce) {
    bryce.group.position.copy(carLocalToWorld(CAR_SEAT_LOCAL));
    bryce.group.rotation.y = car.yaw;
    playLoco('Driving');
  }
  // chase camera: behind the car at the walk-mode distance (wheel works)
  const target = new THREE.Vector3(car.pos.x, car.pos.y + 2.2, car.pos.z);
  const desired = target.clone().addScaledVector(fwd, -camDist).add(new THREE.Vector3(0, 2.5, 0));
  camera.position.lerp(desired, Math.min(1, dt * 5));
  camera.lookAt(target);
}

// ---------- pier mid-section deck (fills the data gap in I35846) ----------
// The government pier model covers the shore end and the tip only; the
// middle (Blender Y -520..-560, centreline X 270) has no deck at all,
// so walking south along the pier drops you into the sea. This patch
// is one concrete box over the gap. Coordinates are converted from the
// raw (pre-recenter) frame exactly like the spawn: scene X/Z = raw -
// modelCenter, scene Y = raw + model.position.y (frameModel shifts the
// model so its bbox minimum sits at y=0). The patch is 44m long (2m
// overlap each end, so a few metres of uncertainty in the real deck's
// edge can't leave a gap) and its top sits 2cm below the tip deck
// (5.78m raw) so the overlap shows the real deck, not a z-fight.
let pierDeck = null; // { mesh, entry }
function createPierDeck() {
  if (pierDeck) {
    scene.remove(pierDeck.mesh);
    const i = raycastTargets.indexOf(pierDeck.entry);
    if (i >= 0) raycastTargets.splice(i, 1);
    pierDeck = null;
  }
  if (!model) return;
  const dx = 270 - modelCenter.x;
  const dz = 540 - modelCenter.z; // gap centre, raw z 520..560
  const topY = 5.76 + model.position.y;
  const deck = new THREE.Mesh(
    new THREE.BoxGeometry(11, 0.5, 44),
    new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.9 })
  );
  deck.position.set(dx, topY - 0.25, dz);
  deck.castShadow = true;
  deck.receiveShadow = true;
  scene.add(deck);
  deck.updateMatrixWorld(true);
  // walkable: add it to the ground raycast targets (same shape as
  // buildRaycastTargets entries), so groundHeight returns the deck
  // top instead of the seabed when the character is on it
  const box = new THREE.Box3().setFromObject(deck);
  const entry = { mesh: deck,
    minX: box.min.x, maxX: box.max.x, minZ: box.min.z, maxZ: box.max.z };
  raycastTargets.push(entry);
  pierDeck = { mesh: deck, entry };
}

function updateWalk(dt) {
  // driving: the car has its own update (movement, ground, camera)
  if (carState === 'driving') { updateDrive(dt); return; }
  // movement relative to the camera's view direction
  const fwd = new THREE.Vector3(charPos.x - camera.position.x, 0, charPos.z - camera.position.z);
  if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, -1);
  fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, UP).normalize();
  const move = new THREE.Vector3();
  if (keys['KeyW']) move.add(fwd);
  if (keys['KeyS']) move.sub(fwd);
  if (keys['KeyD']) move.add(right);
  if (keys['KeyA']) move.sub(right);
  // touch joystick: push up = forward, push right = strafe right
  if (joy.active) {
    move.addScaledVector(fwd, -joy.y);
    move.addScaledVector(right, joy.x);
  }
  moving = move.lengthSq() > 0;
  // martial arts: plant the feet while a move is playing; same while
  // sitting down / seated / standing up, and while getting in/out of
  // the car (the one-shot's root motion does the moving, not the keys)
  const pose = actionPose(clock.elapsedTime);
  if (pose || (bryce && bryce.oneShot) || sitState !== 'stand' || carState !== 'none') { move.set(0, 0, 0); moving = false; }
  const running = keys['ShiftLeft'] || keys['ShiftRight'] || touchRun;
  const wantFly = keys['Space'] || touchFlyUp;
  const wantDown = keys['ControlLeft'] || keys['ControlRight'] || touchFlyDown;
  // vertical: hold Space to fly up, Ctrl to descend; otherwise hover.
  // No flying while seated or in the car.
  let vy = 0;
  if (wantFly && sitState === 'stand' && carState === 'none') { flying = true; vy = 12; }
  if (wantDown) { vy = -12; }
  if (moving) {
    // analog stick: slight push = slow walk (keyboard input is always
    // magnitude >= 1, so it stays full speed)
    const mag = Math.min(1, move.length());
    move.normalize();
    const speed = (flying ? (running ? 60 : 30) : (running ? 25 : 6)) * mag;
    charPos.addScaledVector(move, speed * dt);
    // face the movement direction (smooth turn)
    const targetYaw = Math.atan2(move.x, move.z);
    let d = targetYaw - charYaw;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    charYaw += d * Math.min(1, dt * 10);
    if (!flying) swingPhase += dt * Math.min(speed, 12) * 1.2;
  } else {
    swingPhase *= 0.9;
  }
  // stay inside the map; hitting the edge shows the fog-of-war message
  clampToBounds();
  // vertical + ground
  if (flying) {
    charPos.y += vy * dt;
    const gy = groundHeight(charPos.x, charPos.z, charPos.y);
    if (charPos.y <= gy) { charPos.y = gy; if (vy <= 0) flying = false; }
  } else {
    const gy = groundHeight(charPos.x, charPos.z, charPos.y);
    const rate = gy < charPos.y ? 12 : 6;
    charPos.y += (gy - charPos.y) * Math.min(1, dt * rate);
  }
  charGroup.position.copy(charPos);
  charGroup.rotation.y = charYaw;
  // rigged character: same position/yaw, locomotion clip by state
  if (bryce) {
    bryce.group.position.copy(charPos);
    bryce.group.rotation.y = charYaw;
    // seated: hold the Sitting Idle loop (the normal branch would
    // override it with Idle every frame)
    if (sitState === 'seated') playLoco('Sitting Idle');
    else playLoco(flying ? 'Idle' : (!moving ? 'Idle' : (running ? 'Running' : 'Walking')));
  }
  // legs swing when running on the ground; dangle + lean forward when flying
  const swing = (moving && !flying) ? Math.sin(swingPhase) * 0.7 : 0;
  legL.rotation.x = flying ? 0.4 : swing;
  legR.rotation.x = flying ? 0.4 : -swing;
  armL.rotation.x = flying ? 0.2 : -swing * 0.6; // arms swing opposite the legs
  armR.rotation.x = flying ? 0.2 : swing * 0.6;
  charBody.position.y = (moving && !flying) ? Math.abs(Math.sin(swingPhase)) * 0.08 : 0;
  charBody.rotation.x = flying ? 0.3 : 0;
  charBody.rotation.y = 0;
  // martial arts pose overrides the walk pose while a move is playing
  if (pose) {
    if (pose.armL) armL.rotation.x = pose.armL;
    if (pose.armR) armR.rotation.x = pose.armR;
    if (pose.legL) legL.rotation.x = pose.legL;
    if (pose.legR) legR.rotation.x = pose.legR;
    charBody.rotation.x = pose.bodyX;
    charBody.rotation.y = pose.bodyY;
  }
  updateWalkCamera();
}

function updateFly(dt) {
  // move target + camera together (WASD on ground plane, Q/E vertical)
  const speed = Math.max(modelSize.x, modelSize.z) * 0.25 * (keys['ShiftLeft'] || keys['ShiftRight'] ? 3 : 1) * dt;
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0; forward.normalize();
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0));
  const move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyD']) move.add(right);
  if (keys['KeyA']) move.sub(right);
  if (keys['KeyE'] || keys['Space']) move.y += 1;
  if (keys['KeyQ']) move.y -= 1;
  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(speed);
    camera.position.add(move);
    controls.target.add(move);
  }
  controls.update();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (mode === 'walk' && model) updateWalk(dt);
  else if (model) updateFly(dt);
  else controls.update();
  updateFerry(dt, clock.elapsedTime);
  if (bryce && bryce.mixer) bryce.mixer.update(dt);
  updateSitPrompt();
  updateCarPrompt();
  updateShadowFocus();
  updateNavHud(dt);
  renderer.render(scene, camera);

  frames++; fpsTime += dt;
  if (fpsTime >= 0.5) {
    const fps = Math.round(frames / fpsTime);
    frames = 0; fpsTime = 0;
    statsEl.textContent = model
      ? 'FPS ' + fps + ' · 三角面 ' + renderer.info.render.triangles.toLocaleString() + '\n顯示卡：' + gpuName
      : '顯示卡：' + gpuName;
  }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
